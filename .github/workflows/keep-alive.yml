name: Orihour Storage Keep-Alive

on:
  schedule:
    # Jalan otomatis setiap 3 hari pukul 02:00 UTC (09:00 WIB) agar Supabase Free Tier tidak auto-pause
    - cron: '0 2 */3 * *'
  workflow_dispatch:

jobs:
  ping-storage-pool:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Orihour Keep-Alive Endpoint
        env:
          APP_URL: ${{ secrets.ORIHOUR_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TARGET_URL="${APP_URL:-https://orihour.vercel.app}"
          TARGET_URL="${TARGET_URL%/}"
          echo "Pinging ${TARGET_URL}/api/cron/keep-alive ..."
          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${TARGET_URL}/api/cron/keep-alive")
          cat response.json
          echo ""
          echo "HTTP Status: ${HTTP_CODE}"
          if [ "${HTTP_CODE}" -ne 200 ]; then
            echo "Keep-alive request failed!"
            exit 1
          fi